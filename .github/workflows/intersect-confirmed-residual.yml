name: Intersect confirmed residual failures
on:
  push:
    branches: [main]
    paths:
      - 'intersect_confirmed_residual.py'
      - '.github/workflows/intersect-confirmed-residual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  intersect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: curl -fL https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json -o rophim_catalog.json
      - run: python intersect_confirmed_residual.py
      - run: |
          git config user.name "ivy-intersect"
          git config user.email "actions@users.noreply.github.com"
          git add current_confirmed_residual.json
          git commit -m "Update confirmed residual playback failures" || exit 0
          git push origin HEAD:main
