name: Repair all duplicate season posters now
on:
  push:
    branches: [main]
    paths:
      - 'repair_duplicate_season_posters.py'
      - '.github/workflows/repair-all-season-posters.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main}
      - uses: actions/checkout@v4
        with: {ref: catalog-data, path: data, fetch-depth: 0}
      - run: pip install curl-cffi
      - run: python main/repair_duplicate_season_posters.py data/rophim_catalog.json
      - name: Publish repaired catalog
        working-directory: data
        run: |
          git config user.name "ivy-season-poster-repair"
          git config user.email "actions@users.noreply.github.com"
          git add rophim_catalog.json
          git commit -m "Repair all duplicate season posters" || exit 0
          git push origin HEAD:catalog-data
