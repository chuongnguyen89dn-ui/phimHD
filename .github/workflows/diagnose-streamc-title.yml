name: Diagnose one StreamC catalog title
on:
  push:
    branches: [main]
    paths:
      - 'diagnose_streamc_title.py'
      - '.github/workflows/diagnose-streamc-title.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: pip install -r requirements.txt
      - run: curl -fL https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json -o rophim_catalog.json
      - run: python diagnose_streamc_title.py
