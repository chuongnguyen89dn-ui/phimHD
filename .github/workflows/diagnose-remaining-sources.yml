name: Diagnose remaining source patterns
on:
  push:
    branches: [main]
    paths:
      - 'diagnose_remaining_sources.py'
      - '.github/workflows/diagnose-remaining-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: pip install -r requirements.txt
      - run: python diagnose_remaining_sources.py
      - uses: actions/upload-artifact@v4
        with: {name: remaining-source-diagnostics, path: remaining_source_diagnostics.json}
      - run: |
          git config user.name "ivy-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add remaining_source_diagnostics.json
          git commit -m "Update remaining source diagnostics" || exit 0
          git push origin HEAD:main
