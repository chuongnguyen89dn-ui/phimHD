name: Capture StreamC browser protocol
on:
  push:
    branches: [main]
    paths:
      - 'capture_streamc_browser.py'
      - '.github/workflows/capture-streamc-browser.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python capture_streamc_browser.py
      - uses: actions/upload-artifact@v4
        with: {name: streamc-browser-capture, path: streamc_browser_capture.json}
      - run: |
          git config user.name "ivy-streamc-capture"
          git config user.email "actions@users.noreply.github.com"
          git add streamc_browser_capture.json
          git commit -m "Update StreamC browser capture" || exit 0
          git push origin HEAD:main
