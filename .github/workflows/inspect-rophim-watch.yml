name: Inspect RoPhim watch source
on:
  push:
    branches: [main]
    paths:
      - 'inspect_rophim_watch.py'
      - '.github/workflows/inspect-rophim-watch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl-cffi
      - run: python inspect_rophim_watch.py
