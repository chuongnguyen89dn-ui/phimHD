name: Test Vikings resolver fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app_full.py'
      - 'test_vikings_resolver.py'
      - '.github/workflows/test-vikings-resolver.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -r requirements.txt
      - name: Download catalog
        run: curl -fL --retry 3 https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json -o rophim_catalog.json
      - name: Test Vikings episode 1
        env:
          IVY_CATALOG: rophim_catalog.json
          ROPHIM_CATALOG: rophim_catalog.json
          IVY_REMOTE_CATALOG: http://127.0.0.1:9/disabled
        run: python test_vikings_resolver.py

# rerun after full app restore
