name: Audit production visible posters
on:
  push:
    branches: [main]
    paths: ['audit_visible_posters.py','.github/workflows/audit-visible-posters.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install curl-cffi
      - run: python audit_visible_posters.py
      - uses: actions/upload-artifact@v4
        with: {name: visible-poster-health, path: visible_poster_health.json}
