name: Diagnose six confirmed residuals
on:
  push:
    branches: [main]
    paths:
      - 'diagnose_six_residuals.py'
      - '.github/workflows/diagnose-six-residuals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: curl -fL https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json -o rophim_catalog.json
      - run: python diagnose_six_residuals.py
