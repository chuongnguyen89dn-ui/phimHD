name: Inspect source year fields
on:
  push:
    branches: [main]
    paths: ['inspect_year_source.py','.github/workflows/inspect-year-source.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install curl-cffi
      - run: python inspect_year_source.py
