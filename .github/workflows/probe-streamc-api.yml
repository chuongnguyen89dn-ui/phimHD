name: Probe StreamC API
on:
  push:
    branches: [main]
    paths:
      - 'probe_streamc_api.py'
      - '.github/workflows/probe-streamc-api.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: pip install curl-cffi
      - run: python probe_streamc_api.py
      - uses: actions/upload-artifact@v4
        with: {name: streamc-api-probe, path: streamc_api_probe.json}
      - run: |
          git config user.name "ivy-streamc-probe"
          git config user.email "actions@users.noreply.github.com"
          git add streamc_api_probe.json
          git commit -m "Update StreamC API probe" || exit 0
          git push origin HEAD:main
