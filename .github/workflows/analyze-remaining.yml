name: Analyze remaining playback and posters

on:
  push:
    branches: [main]
    paths:
      - 'analyze_remaining_failures.py'
      - '.github/workflows/analyze-remaining.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download current catalog
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json \
            -o rophim_catalog.json
      - name: Analyze
        run: python analyze_remaining_failures.py
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-failure-analysis
          path: remaining_failure_analysis.json
      - name: Publish report
        run: |
          git config user.name "ivy-analysis"
          git config user.email "actions@users.noreply.github.com"
          git add remaining_failure_analysis.json
          git commit -m "Update remaining failure analysis" || exit 0
          git push origin HEAD:main

# rerun after streamc audit
