name: Benchmark production latency
on:
  push:
    branches: [main]
    paths: ['benchmark_production.py','.github/workflows/benchmark-production.yml']
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install curl-cffi
      - run: python benchmark_production.py
      - uses: actions/upload-artifact@v4
        with: {name: production-benchmark, path: benchmark_production.json}
