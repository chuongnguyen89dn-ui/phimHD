name: Test RoPhim watch resolver
on:
  push:
    branches: [main]
    paths:
      - 'app_full.py'
      - 'test_rophim_watch_resolver.py'
      - '.github/workflows/test-rophim-watch-resolver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: curl -fL https://raw.githubusercontent.com/chuongnguyen89dn-ui/phimHD/catalog-data/rophim_catalog.json -o rophim_catalog.json
      - run: python test_rophim_watch_resolver.py
