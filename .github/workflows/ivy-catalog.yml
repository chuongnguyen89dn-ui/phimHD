name: Ivy catalog update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: ivy-catalog-fast
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Ivy catalog from source web
        env:
          ROPHIM_CATALOG: rophim_catalog.json
          ROPHIM_WORKERS: '32'
        run: python rophim_catalog_crawler_taxonomy_v5.py
      - name: Publish catalog to data branch only
        run: |
          git config user.name "ivy-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rophim_catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Update Ivy catalog data"
          git push --force origin HEAD:catalog-data
