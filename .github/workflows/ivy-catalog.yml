name: Ivy catalog update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'rophim_catalog.json'
  schedule:
    - cron: '15 19 * * *'
permissions:
  contents: write
concurrency:
  group: ivy-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Ivy catalog
        env:
          ROPHIM_CATALOG: rophim_catalog.json
          ROPHIM_WORKERS: '12'
        run: python rophim_catalog_crawler_taxonomy_v5.py
      - name: Commit changed catalog
        run: |
          git config user.name "ivy-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rophim_catalog.json
          git diff --cached --quiet || git commit -m "Update Ivy catalog"
          git push
