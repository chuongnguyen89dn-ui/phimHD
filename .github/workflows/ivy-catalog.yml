name: Ivy catalog update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivy-catalog.yml'
      - 'rophim_catalog_crawler_taxonomy_v5.py'
      - 'tmdb_enrich.py'
      - 'ivy_playback_audit.py'
  schedule:
    - cron: '0 0,8,16 * * *'
permissions:
  contents: write
concurrency:
  group: ivy-catalog-fast
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Ivy catalog from source web
        env:
          ROPHIM_CATALOG: rophim_catalog.json
          ROPHIM_WORKERS: '32'
        run: python rophim_catalog_crawler_taxonomy_v5.py
      - name: Audit and cache playback sources
        env:
          ROPHIM_CATALOG: rophim_catalog.json
          IVY_PLAYBACK_AUDIT_LIMIT: '120'
        run: python ivy_playback_audit.py
      - name: Enrich objective rankings from TMDB when configured
        env:
          ROPHIM_CATALOG: rophim_catalog.json
        run: |
          if [ -n "$TMDB_BEARER_TOKEN" ]; then
            python tmdb_enrich.py
          else
            echo "TMDB_BEARER_TOKEN not configured; skipping TMDB enrichment"
          fi
      - name: Publish catalog to data branch only
        run: |
          git config user.name "ivy-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rophim_catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Update Ivy catalog data"
          git push --force origin HEAD:catalog-data
