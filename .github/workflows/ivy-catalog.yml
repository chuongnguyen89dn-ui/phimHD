name: Ivy catalog update
on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Rebuild catalog, poster and playback links from RoPhim from scratch'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivy-catalog.yml'
      - 'rophim_catalog_crawler_taxonomy_v5.py'
      - 'ivy_sitemap_crawler.py'
      - 'ivy_playback_audit.py'
      - 'ivy_sitewide_verify.py'
  schedule:
    - cron: '0 0,8,16 * * *'
permissions:
  contents: write
concurrency:
  group: ivy-catalog-fast
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Load previous catalog snapshot
        run: |
          git fetch origin catalog-data || true
          git show origin/catalog-data:rophim_catalog.json > /tmp/rophim_catalog_previous.json 2>/dev/null || echo '{"movies":[]}' > /tmp/rophim_catalog_previous.json

      - name: Update Ivy catalog from source web
        env:
          ROPHIM_CATALOG: rophim_catalog.staging.json
          ROPHIM_BASE: https://rophims.team
          ROPHIM_WORKERS: '32'
          ROPHIM_FULL_REBUILD: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_rebuild) || contains(github.event.head_commit.message, '[full-rebuild]') && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.full_rebuild }}" != "true" ]; then
            cp /tmp/rophim_catalog_previous.json rophim_catalog.staging.json
          fi
          python rophim_catalog_crawler_taxonomy_v5.py

      - name: Build catalog change report
        run: |
          python - <<'PY'
          import json, datetime, os
          oldp='/tmp/rophim_catalog_previous.json'
          newp='rophim_catalog.staging.json'
          def load(p):
              try:
                  with open(p,encoding='utf-8') as f: return json.load(f)
              except Exception: return {}
          def movies(x):
              if isinstance(x,list): return x
              for k in ('movies','items','data'):
                  if isinstance(x.get(k),list): return x[k]
              return []
          def key(x):
              if not isinstance(x,dict): return str(x)
              return x.get('url') or x.get('slug') or x.get('id') or x.get('title') or json.dumps(x,sort_keys=True,ensure_ascii=False)
          def title(x):
              if not isinstance(x,dict): return str(x)
              return x.get('title') or x.get('name') or x.get('slug') or x.get('url') or '(unknown)'
          old,new=movies(load(oldp)),movies(load(newp))
          om={key(x):x for x in old}; nm={key(x):x for x in new}
          added=[nm[k] for k in nm.keys()-om.keys()]
          removed=[om[k] for k in om.keys()-nm.keys()]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report={'generatedAt':now,'previousTotal':len(om),'currentTotal':len(nm),'netChange':len(nm)-len(om),'addedCount':len(added),'removedCount':len(removed),'added':[{'title':title(x),'url':x.get('url','') if isinstance(x,dict) else ''} for x in added],'removed':[{'title':title(x),'url':x.get('url','') if isinstance(x,dict) else ''} for x in removed]}
          with open('catalog_changes_latest.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          os.makedirs('catalog-history',exist_ok=True)
          fn=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H-%M-%SZ')+'.json'
          with open(os.path.join('catalog-history',fn),'w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          print(f"CATALOG_DIFF previous={len(om)} current={len(nm)} net={len(nm)-len(om)} added={len(added)} removed={len(removed)}")
          for x in added: print("ADDED:",title(x))
          for x in removed: print("REMOVED:",title(x))
          PY

      - name: Crawl exact source sitemap and pagination
        env:
          IVY_SITEMAP_OUT: ivy_sitemap.staging.json
          IVY_SOURCE_BASE: https://rophims.team
        run: python ivy_sitemap_crawler.py
      - name: Verify whole-site count and exact section ordering
        env:
          ROPHIM_CATALOG: rophim_catalog.staging.json
          IVY_SITEMAP_OUT: ivy_sitemap.staging.json
          IVY_SITE_VERIFY_OUT: sitewide_verification.staging.json
        run: python ivy_sitewide_verify.py

      - name: Audit and cache playback sources
        env:
          ROPHIM_CATALOG: rophim_catalog.staging.json
          IVY_PLAYBACK_AUDIT_LIMIT: '0'
          IVY_PLAYBACK_WORKERS: '24'
        run: python ivy_playback_audit.py

      - name: Validate staging snapshot before production publish
        run: |
          python - <<'PY'
          import json, re, sys
          from urllib.parse import urlparse

          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f)
          old=load('/tmp/rophim_catalog_previous.json')
          new=load('rophim_catalog.staging.json')
          sm=load('ivy_sitemap.staging.json')

          old_movies=old.get('movies') or []
          movies=new.get('movies') or []
          sections=sm.get('sections') or []

          def key(x):
              u=str(x.get('url') or '')
              p=urlparse(u)
              return p.path.rstrip('/').lower()

          keys=[key(x) for x in movies if key(x)]
          dup=len(keys)-len(set(keys))
          posters=sum(1 for x in movies if str(x.get('poster') or '').startswith(('http://','https://')))
          poster_ratio=(posters/len(movies)) if movies else 0
          old_count=len(old_movies);new_count=len(movies)
          minimum=max(1000,int(old_count*0.80)) if old_count else 1000
          harvest=new.get('playbackHarvest') or {}
          with_links=int(harvest.get('withLinks') or 0)
          checked=int(harvest.get('checked') or 0)

          print(f'VALIDATE old={old_count} new={new_count} minimum={minimum} duplicates={dup} posters={posters}/{new_count} sections={len(sections)} playback={with_links}/{checked}')

          errors=[]
          if new_count < minimum:errors.append(f'catalog shrank too much: {new_count} < {minimum}')
          if dup:errors.append(f'duplicate canonical movie paths: {dup}')
          if poster_ratio < 0.85:errors.append(f'poster coverage too low: {poster_ratio:.1%}')
          if len(sections) < 15:errors.append(f'too few homepage sections: {len(sections)}')
          if checked and with_links == 0:errors.append('playback harvest found zero source links')
          if errors:
              print('STAGING REJECTED:')
              for e in errors:print(' -',e)
              sys.exit(1)
          print('STAGING ACCEPTED')
          PY

      - name: Promote validated staging snapshot atomically
        run: |
          cp rophim_catalog.staging.json rophim_catalog.json
          cp ivy_sitemap.staging.json ivy_sitemap.json
          cp sitewide_verification.staging.json sitewide_verification.json

      - name: Publish catalog, sitemap and change history to data branch
        run: |
          git config user.name "ivy-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rophim_catalog.json ivy_sitemap.json sitewide_verification.json catalog_changes_latest.json catalog-history/
          if git diff --cached --quiet; then
            echo "Catalog and sitemap unchanged"
            exit 0
          fi
          git commit -m "Update Ivy catalog, source sitemap and change report"
          git push --force origin HEAD:catalog-data
