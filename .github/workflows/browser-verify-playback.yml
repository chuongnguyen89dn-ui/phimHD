name: Browser verify playback candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser_verify_candidates.py'
      - '.github/workflows/browser-verify-playback.yml'

permissions:
  contents: write

concurrency:
  group: ivy-browser-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify only shortlisted playback candidates
        env:
          IVY_TARGETED_REPORT: targeted_playback_report.json
          IVY_BROWSER_REPORT: browser_playback_verification.json
          IVY_BROWSER_WORKERS: '4'
          IVY_BROWSER_PAGE_TIMEOUT: '45000'
          IVY_BROWSER_WAIT_MS: '9000'
        run: python browser_verify_candidates.py

      - name: Upload browser verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-playback-verification
          path: browser_playback_verification.json
          retention-days: 14

      - name: Publish latest browser verification
        run: |
          git config user.name "ivy-playback-audit"
          git config user.email "actions@users.noreply.github.com"
          git add browser_playback_verification.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
            exit 0
          fi
          git commit -m "Update browser playback verification"
          git push origin HEAD:main
